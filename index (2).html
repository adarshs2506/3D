<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Masterplan Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header & Navigation */
    header { background: #1a252f; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; }
    .header-actions { display: flex; gap: 10px; }
    .btn-header { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
    .btn-call { background: #2980b9; }

    /* Main Container */
    .container { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Controls Sidebar */
    .controls { flex: 1; min-width: 280px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .search-box { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-btn { flex: 1; padding: 8px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; text-align: center; }
    .filter-btn.active { background: #3498db; color: white; border-color: #3498db; }
    
    /* Legend */
    .legend { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .legend-item { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px; border-radius: 4px; }
    .legend-color { width: 20px; height: 20px; border-radius: 3px; }
    .bg-available { background-color: #2ecc71; }
    .bg-booked { background-color: #e74c3c; }
    .bg-sold { background-color: #e67e22; }

    /* Visualizer Map Area */
    .visualizer { flex: 2; min-width: 320px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .map-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; border: 2px dashed #bbb; border-radius: 8px; padding: 10px; background: #fafafa; }
    svg { width: 100%; height: auto; }
    .plot { cursor: pointer; transition: opacity 0.2s, stroke 0.2s; stroke: #fff; stroke-width: 2; }
    .plot:hover { opacity: 0.8; stroke: #333; }
    .plot-text { font-size: 14px; fill: white; font-weight: bold; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }

    /* Modal / Details Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 400px; width: 90%; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 20px; cursor: pointer; border: none; background: none; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-wa { background: #25D366; color: white; padding: 10px; border-radius: 4px; text-decoration: none; flex: 1; text-align: center; display: block; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>Masterplan Layout Viewer</h1>
    <div class="header-actions">
      <a href="tel:+917355150877" class="btn-header btn-call">☎ Call Agent</a>
      <a href="https://maps.google.com/?q=Lucknow,Uttar+Pradesh,India" target="_blank" class="btn-header">📍 Location</a>
    </div>
  </header>

  <div class="container">
    <!-- Controls & Filters Sidebar -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Search Plot Number (e.g. 01)..." onkeyup="filterPlots()" />
      
      <h3>Status Filter</h3>
      <div class="legend">
        <div class="legend-item" onclick="filterStatus('all')">
          <div class="legend-color" style="background:#7f8c8d;"></div> <span>Show All Plots</span>
        </div>
        <div class="legend-item" onclick="filterStatus('available')">
          <div class="legend-color bg-available"></div> <span>Available Plots</span>
        </div>
        <div class="legend-item" onclick="filterStatus('booked')">
          <div class="legend-color bg-booked"></div> <span>Booked Plots</span>
        </div>
        <div class="legend-item" onclick="filterStatus('sold')">
          <div class="legend-color bg-sold"></div> <span>Sold Plots</span>
        </div>
      </div>
    </div>

    <!-- Layout Canvas Visualizer -->
    <div class="visualizer">
      <h2>Interactive Masterplan</h2>
      <p style="margin-bottom: 15px; color: #666; font-size: 0.9rem;">Plot par click karke details aur booking option dekhein</p>
      
      <div class="map-container">
        <svg viewBox="0 0 500 300" id="masterplanSvg">
          <!-- Plots dynamically rendered via JS -->
        </svg>
      </div>
    </div>
  </div>

  <!-- Plot Detail Modal Popup -->
  <div class="modal" id="plotModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle">Plot Details</h2>
      <hr style="margin: 10px 0;">
      <p><strong>Status:</strong> <span id="modalStatus"></span></p>
      <p><strong>Facing:</strong> <span id="modalFacing"></span></p>
      <p><strong>Area:</strong> <span id="modalArea"></span></p>
      <p><strong>Price:</strong> <span id="modalPrice"></span></p>
      
      <div class="modal-actions">
        <a id="waLink" href="#" target="_blank" class="btn-wa">Enquire on WhatsApp</a>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 1. Dynamic Plot Data Source (JSON Architecture)
    const plotsData = [
      { id: "1", name: "Plot 01", status: "booked", facing: "North", area: "1200 sqft", price: "₹35,00,000", x: 50, y: 50, width: 100, height: 80 },
      { id: "2", name: "Plot 02", status: "available", facing: "North", area: "1500 sqft", price: "₹42,00,000", x: 170, y: 50, width: 100, height: 80 },
      { id: "3", name: "Plot 03", status: "available", facing: "East", area: "1000 sqft", price: "₹28,00,000", x: 290, y: 50, width: 100, height: 80 },
      { id: "4", name: "Plot 04", status: "sold", facing: "East", area: "1800 sqft", price: "₹50,00,000", x: 50, y: 160, width: 100, height: 80 },
      { id: "5", name: "Plot 05", status: "available", facing: "South", area: "1200 sqft", price: "₹36,00,000", x: 170, y: 160, width: 100, height: 80 }
    ];

    const statusColors = {
      available: "#2ecc71",
      booked: "#e74c3c",
      sold: "#e67e22"
    };

    // 2. Render SVG Layout
    function renderMasterplan(data) {
      const svg = document.getElementById('masterplanSvg');
      svg.innerHTML = '';

      data.forEach(plot => {
        // Create SVG Group
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        
        // Create Rectangle Shape
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", plot.x);
        rect.setAttribute("y", plot.y);
        rect.setAttribute("width", plot.width);
        rect.setAttribute("height", plot.height);
        rect.setAttribute("fill", statusColors[plot.status]);
        rect.setAttribute("class", "plot");
        rect.setAttribute("rx", "5");
        rect.onclick = () => openModal(plot);

        // Create Text Label
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", plot.x + plot.width / 2);
        text.setAttribute("y", plot.y + plot.height / 2);
        text.setAttribute("class", "plot-text");
        text.textContent = plot.name;

        g.appendChild(rect);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    // 3. Modal Handler
    function openModal(plot) {
      document.getElementById('modalTitle').innerText = plot.name;
      document.getElementById('modalStatus').innerText = plot.status.toUpperCase();
      document.getElementById('modalFacing').innerText = plot.facing;
      document.getElementById('modalArea').innerText = plot.area;
      document.getElementById('modalPrice').innerText = plot.price;
      
      const waMsg = encodeURIComponent(`Hi, I am interested in ${plot.name} (${plot.area}, Facing: ${plot.facing}).`);
      document.getElementById('waLink').href = `https://wa.me/917355150877?text=${waMsg}`;

      document.getElementById('plotModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('plotModal').style.display = 'none';
    }

    // 4. Filtering Logic
    function filterStatus(status) {
      if (status === 'all') {
        renderMasterplan(plotsData);
      } else {
        const filtered = plotsData.filter(p => p.status === status);
        renderMasterplan(filtered);
      }
    }

    function filterPlots() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = plotsData.filter(p => p.name.toLowerCase().includes(query));
      renderMasterplan(filtered);
    }

    // Initial Load
    renderMasterplan(plotsData);
  </script>
</body>
</html>
